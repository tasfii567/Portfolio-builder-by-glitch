<svg viewBox="0 0 460 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="460" height="520" fill="#f4f1ea"/>

  <!-- order summary card (background, partially behind picker) -->
  <rect x="20" y="20" width="420" height="130" rx="6" fill="#ffffff"/>
  <text x="40" y="46" font-size="11" fill="#9a9a9a">Your Order</text>
  <text x="40" y="70" font-size="16" font-weight="700" fill="#2b2b2b">La Catrina</text>
  <text x="40" y="90" font-size="10.5" fill="#8a8a8a">820 Spinka Square Suite 260</text>
  <text x="40" y="116" font-size="10" fill="#9a9a9a">How</text>
  <text x="90" y="116" font-size="10" fill="#9a9a9a">Delivery</text>
  <text x="370" y="116" font-size="10" fill="#1c7d77" text-decoration="underline">Change</text>

  <!-- date/time picker panel -->
  <rect x="60" y="170" width="260" height="300" rx="8" fill="#ffffff" stroke="#e7e3d8"/>
  <text x="80" y="198" font-size="10.5" fill="#6a6a6a">When</text>
  <rect x="248" y="184" width="48" height="22" rx="11" fill="#e9e9e9"/>
  <circle cx="258" cy="195" r="8" fill="#1fae8e"/>
  <text x="80" y="214" font-size="10" fill="#9a9a9a">Delivery</text>
  <text x="220" y="214" font-size="10" fill="#9a9a9a">Pickup</text>

  <!-- day pills -->
  <g font-size="10" font-weight="600">
    <rect x="80" y="226" width="84" height="22" rx="4" fill="#ffffff" stroke="#dfe2ea"/>
    <text x="100" y="241" fill="#5a5e6d">Today</text>

    <rect x="80" y="252" width="84" height="22" rx="4" fill="#1c7d77"/>
    <text x="92" y="267" fill="#ffffff">Tomorrow</text>

    <rect x="80" y="278" width="84" height="22" rx="4" fill="#ffffff" stroke="#dfe2ea"/>
    <text x="92" y="293" fill="#5a5e6d">Jan 11 Fri</text>

    <rect x="80" y="304" width="84" height="22" rx="4" fill="#ffffff" stroke="#dfe2ea"/>
    <text x="92" y="319" fill="#5a5e6d">Jan 12 Sat</text>

    <rect x="80" y="330" width="84" height="22" rx="4" fill="#ffffff" stroke="#dfe2ea"/>
    <text x="92" y="345" fill="#5a5e6d">Jan 13 Sun</text>
  </g>

  <!-- time slots -->
  <g font-size="10" fill="#7a7a7a">
    <text x="200" y="241">10:00 AM</text>
    <text x="200" y="263">10:15 AM</text>
    <text x="200" y="285" fill="#1c7d77" font-weight="700">10:30 AM</text>
    <path d="M256 281l3 4 6-8" stroke="#1c7d77" stroke-width="1.6" fill="none"/>
    <text x="200" y="307">10:45 AM</text>
    <text x="200" y="329">11:00 AM</text>
    <text x="200" y="351">11:15 AM</text>
  </g>

  <line x1="60" y1="436" x2="320" y2="436" stroke="#eee" stroke-width="1.5"/>
  <text x="80" y="458" font-size="11" fill="#5a5a5a">Total</text>
  <text x="270" y="458" font-size="13" font-weight="700" fill="#2b2b2b" text-anchor="end">$35.28</text>
</svg>
